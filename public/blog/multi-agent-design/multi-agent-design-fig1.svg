<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1110" width="100%" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="2400" height="1110" fill="#fff"/>
<text x="60" y="88" style="font-size:40px;font-weight:800;fill:#0f172a">Five workflow patterns, and the three this system uses</text>
<text x="60" y="122" style="font-size:19px;fill:#475569">Solid cards are used; dashed grey cards are not. Pattern names follow Schluntz and Zhang (2024).</text>
<rect x="60" y="165" width="436" height="900" rx="14" fill="#fff" stroke="#2563eb" stroke-width="3.5"/><rect x="60" y="165" width="436" height="64" rx="14" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="60" y="205" width="436" height="24" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="278" y="207" style="font-size:25px;font-weight:700;fill:#fff;text-anchor:middle">Prompt chaining</text><text x="278" y="265" style="font-size:17px;font-weight:500;fill:#475569;text-anchor:middle">Fixed steps in order,</text><text x="278" y="289" style="font-size:17px;font-weight:500;fill:#475569;text-anchor:middle">with a check between steps</text><rect x="233" y="312" width="90" height="36" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="278" y="335.25" style="font-size:15px;font-weight:700;fill:#334155;text-anchor:middle">In</text><path d="M278 348 L278 380" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="203" y="381" width="150" height="46" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="278" y="409.6" style="font-size:16px;font-weight:700;fill:#0f172a;text-anchor:middle">LLM step 1</text><path d="M278 427 L278 462" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><path d="M278 463L322.8 495L278 527L233.2 495Z" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="278" y="500" style="font-size:14.5px;font-weight:700;fill:#1e293b;text-anchor:middle">gate</text><path d="M323 495 H398 V404 H355" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="406" y="455" style="font-size:14px;font-weight:500;fill:#64748b;text-anchor:start">fail</text><path d="M278 527 L278 562" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="203" y="563" width="150" height="46" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="278" y="591.6" style="font-size:16px;font-weight:700;fill:#0f172a;text-anchor:middle">LLM step 2</text><path d="M278 609 L278 644" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="203" y="645" width="150" height="46" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="278" y="673.6" style="font-size:16px;font-weight:700;fill:#0f172a;text-anchor:middle">LLM step 3</text><path d="M278 691 L278 722" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="233" y="722" width="90" height="36" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="278" y="745.25" style="font-size:15px;font-weight:700;fill:#334155;text-anchor:middle">Out</text><line x1="90" y1="790" x2="466" y2="790" stroke="#e2e8f0" stroke-width="2"/><text x="278" y="826" style="font-size:14px;font-weight:700;fill:#2563eb;text-anchor:middle">IN THIS SYSTEM</text><text x="278" y="860" style="font-size:17.5px;font-weight:500;fill:#1e293b;text-anchor:middle">The backbone. Gate, substance,</text><text x="278" y="886" style="font-size:17.5px;font-weight:500;fill:#1e293b;text-anchor:middle">line, figures, gate, series:</text><text x="278" y="912" style="font-size:17.5px;font-weight:500;fill:#1e293b;text-anchor:middle">each stage starts only when</text><text x="278" y="938" style="font-size:17.5px;font-weight:500;fill:#1e293b;text-anchor:middle">the one before it passes.</text><rect x="241.8" y="1001" width="72.4" height="38" rx="19" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="278" y="1026" style="font-size:16.5px;font-weight:700;fill:#fff;text-anchor:middle">USED</text><rect x="526" y="165" width="436" height="900" rx="14" fill="#fff" stroke="#c2410c" stroke-width="3.5"/><rect x="526" y="165" width="436" height="64" rx="14" fill="#c2410c" stroke="#c2410c" stroke-width="2"/><rect x="526" y="205" width="436" height="24" rx="0" fill="#c2410c" stroke="#c2410c" stroke-width="2"/><text x="744" y="207" style="font-size:25px;font-weight:700;fill:#fff;text-anchor:middle">Evaluator–optimizer</text><text x="744" y="265" style="font-size:17px;font-weight:500;fill:#475569;text-anchor:middle">One model drafts, another</text><text x="744" y="289" style="font-size:17px;font-weight:500;fill:#475569;text-anchor:middle">critiques, and they loop</text><rect x="699" y="312" width="90" height="36" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="744" y="335.25" style="font-size:15px;font-weight:700;fill:#334155;text-anchor:middle">In</text><path d="M674 348 L674 450" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="589" y="453" width="170" height="46" rx="8" fill="#fff1e6" stroke="#c2410c" stroke-width="2"/><text x="674" y="481.6" style="font-size:16px;font-weight:700;fill:#0f172a;text-anchor:middle">generator</text><rect x="749" y="577" width="170" height="46" rx="8" fill="#fff1e6" stroke="#c2410c" stroke-width="2"/><text x="834" y="605.6" style="font-size:16px;font-weight:700;fill:#0f172a;text-anchor:middle">evaluator</text><path d="M759 476 H834 V575" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ah)"/><text x="844" y="520" style="font-size:14px;font-weight:500;fill:#64748b;text-anchor:start">draft</text><path d="M749 600 H674 V501" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ah)"/><text x="664" y="558" style="font-size:14px;font-weight:500;fill:#64748b;text-anchor:end">critique</text><path d="M834 623 L834 722" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><text x="844" y="680" style="font-size:14px;font-weight:500;fill:#64748b;text-anchor:start">accepted</text><rect x="789" y="722" width="90" height="36" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="834" y="745.25" style="font-size:15px;font-weight:700;fill:#334155;text-anchor:middle">Out</text><line x1="556" y1="790" x2="932" y2="790" stroke="#e2e8f0" stroke-width="2"/><text x="744" y="826" style="font-size:14px;font-weight:700;fill:#c2410c;text-anchor:middle">IN THIS SYSTEM</text><text x="744" y="860" style="font-size:17.5px;font-weight:500;fill:#1e293b;text-anchor:middle">Every editor. The writer</text><text x="744" y="886" style="font-size:17.5px;font-weight:500;fill:#1e293b;text-anchor:middle">revises until the editor</text><text x="744" y="912" style="font-size:17.5px;font-weight:500;fill:#1e293b;text-anchor:middle">returns SATISFIED, for at</text><text x="744" y="938" style="font-size:17.5px;font-weight:500;fill:#1e293b;text-anchor:middle">most three rounds.</text><rect x="707.8" y="1001" width="72.4" height="38" rx="19" fill="#c2410c" stroke="#c2410c" stroke-width="2"/><text x="744" y="1026" style="font-size:16.5px;font-weight:700;fill:#fff;text-anchor:middle">USED</text><rect x="992" y="165" width="436" height="900" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="3.5"/><rect x="992" y="165" width="436" height="64" rx="14" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><rect x="992" y="205" width="436" height="24" rx="0" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="1210" y="207" style="font-size:25px;font-weight:700;fill:#fff;text-anchor:middle">Orchestrator–workers</text><text x="1210" y="265" style="font-size:17px;font-weight:500;fill:#475569;text-anchor:middle">A lead model hands</text><text x="1210" y="289" style="font-size:17px;font-weight:500;fill:#475569;text-anchor:middle">subtasks to workers</text><rect x="1165" y="312" width="90" height="36" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="1210" y="335.25" style="font-size:15px;font-weight:700;fill:#334155;text-anchor:middle">In</text><path d="M1210 348 L1210 380" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="1115" y="383" width="190" height="46" rx="8" fill="#f3edff" stroke="#7c3aed" stroke-width="2"/><text x="1210" y="411.6" style="font-size:16px;font-weight:700;fill:#0f172a;text-anchor:middle">orchestrator</text><path d="M1164.5 429 L1080 520" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="1025" y="523" width="110" height="46" rx="8" fill="#f3edff" stroke="#7c3aed" stroke-width="2"/><text x="1080" y="551.6" style="font-size:16px;font-weight:700;fill:#0f172a;text-anchor:middle">worker</text><path d="M1080 569 L1164.5 646" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><path d="M1210 429 L1210 520" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="1155" y="523" width="110" height="46" rx="8" fill="#f3edff" stroke="#7c3aed" stroke-width="2"/><text x="1210" y="551.6" style="font-size:16px;font-weight:700;fill:#0f172a;text-anchor:middle">worker</text><path d="M1210 569 L1210 646" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><path d="M1255.5 429 L1340 520" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="1285" y="523" width="110" height="46" rx="8" fill="#f3edff" stroke="#7c3aed" stroke-width="2"/><text x="1340" y="551.6" style="font-size:16px;font-weight:700;fill:#0f172a;text-anchor:middle">worker</text><path d="M1340 569 L1255.5 646" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="1115" y="647" width="190" height="46" rx="8" fill="#f3edff" stroke="#7c3aed" stroke-width="2"/><text x="1210" y="675.6" style="font-size:16px;font-weight:700;fill:#0f172a;text-anchor:middle">synthesize</text><path d="M1210 693 L1210 722" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/><rect x="1165" y="722" width="90" height="36" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="1210" y="745.25" style="font-size:15px;font-weight:700;fill:#334155;text-anchor:middle">Out</text><line x1="1022" y1="790" x2="1398" y2="790" stroke="#e2e8f0" stroke-width="2"/><text x="1210" y="826" style="font-size:14px;font-weight:700;fill:#7c3aed;text-anchor:middle">IN THIS SYSTEM</text><text x="1210" y="860" style="font-size:17.5px;font-weight:500;fill:#1e293b;text-anchor:middle">The writer starts each editor</text><text x="1210" y="886" style="font-size:17.5px;font-weight:500;fill:#1e293b;text-anchor:middle">as a cold subagent and applies</text><text x="1210" y="912" style="font-size:17.5px;font-weight:500;fill:#1e293b;text-anchor:middle">its findings. The roster is</text><text x="1210" y="938" style="font-size:17.5px;font-weight:500;fill:#1e293b;text-anchor:middle">fixed in a file, never chosen.</text><rect x="1106.6" y="1001" width="206.79999999999998" height="38" rx="19" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="1210" y="1026" style="font-size:16.5px;font-weight:700;fill:#fff;text-anchor:middle">USED, FIXED ROSTER</text><rect x="1458" y="165" width="436" height="900" rx="14" fill="#fbfcfd" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 7"/><rect x="1458" y="165" width="436" height="64" rx="14" fill="#94a3b8" stroke="#94a3b8" stroke-width="2"/><rect x="1458" y="205" width="436" height="24" rx="0" fill="#94a3b8" stroke="#94a3b8" stroke-width="2"/><text x="1676" y="207" style="font-size:25px;font-weight:700;fill:#fff;text-anchor:middle">Routing</text><text x="1676" y="265" style="font-size:17px;font-weight:500;fill:#475569;text-anchor:middle">Classify the input and</text><text x="1676" y="289" style="font-size:17px;font-weight:500;fill:#475569;text-anchor:middle">send it down one path</text><rect x="1631" y="312" width="90" height="36" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1676" y="335.25" style="font-size:15px;font-weight:700;fill:#334155;text-anchor:middle">In</text><path d="M1676 348 L1676 390" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><path d="M1676 391L1723.6 425L1676 459L1628.4 425Z" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="1676" y="430" style="font-size:14.5px;font-weight:700;fill:#1e293b;text-anchor:middle">router</text><path d="M1676 459 L1676 490 L1546 490 L1546 540" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="1491" y="543" width="110" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1546" y="571.6" style="font-size:16px;font-weight:700;fill:#64748b;text-anchor:middle">path A</text><path d="M1546 589 V660 H1676" fill="none" stroke="#94a3b8" stroke-width="2"/><path d="M1676 459 L1676 490 L1676 490 L1676 540" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="1621" y="543" width="110" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1676" y="571.6" style="font-size:16px;font-weight:700;fill:#64748b;text-anchor:middle">path B</text><path d="M1676 589 V660 H1676" fill="none" stroke="#94a3b8" stroke-width="2"/><path d="M1676 459 L1676 490 L1806 490 L1806 540" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="1751" y="543" width="110" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1806" y="571.6" style="font-size:16px;font-weight:700;fill:#64748b;text-anchor:middle">path C</text><path d="M1806 589 V660 H1676" fill="none" stroke="#94a3b8" stroke-width="2"/><path d="M1676 660 L1676 722" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="1631" y="722" width="90" height="36" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1676" y="745.25" style="font-size:15px;font-weight:700;fill:#334155;text-anchor:middle">Out</text><line x1="1488" y1="790" x2="1864" y2="790" stroke="#e2e8f0" stroke-width="2"/><text x="1676" y="826" style="font-size:14px;font-weight:700;fill:#64748b;text-anchor:middle">IN THIS SYSTEM</text><text x="1676" y="860" style="font-size:17.5px;font-weight:500;fill:#64748b;text-anchor:middle">Not really. Scripts count and</text><text x="1676" y="886" style="font-size:17.5px;font-weight:500;fill:#64748b;text-anchor:middle">models judge, but that is a</text><text x="1676" y="912" style="font-size:17.5px;font-weight:500;fill:#64748b;text-anchor:middle">division of labour decided</text><text x="1676" y="938" style="font-size:17.5px;font-weight:500;fill:#64748b;text-anchor:middle">in advance, not per input.</text><rect x="1620.6" y="1001" width="110.8" height="38" rx="19" fill="#fff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/><text x="1676" y="1026" style="font-size:16.5px;font-weight:700;fill:#64748b;text-anchor:middle">NOT USED</text><rect x="1924" y="165" width="436" height="900" rx="14" fill="#fbfcfd" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 7"/><rect x="1924" y="165" width="436" height="64" rx="14" fill="#94a3b8" stroke="#94a3b8" stroke-width="2"/><rect x="1924" y="205" width="436" height="24" rx="0" fill="#94a3b8" stroke="#94a3b8" stroke-width="2"/><text x="2142" y="207" style="font-size:25px;font-weight:700;fill:#fff;text-anchor:middle">Parallelization</text><text x="2142" y="265" style="font-size:17px;font-weight:500;fill:#475569;text-anchor:middle">Run several models at once;</text><text x="2142" y="289" style="font-size:17px;font-weight:500;fill:#475569;text-anchor:middle">split the work, or vote</text><rect x="2097" y="312" width="90" height="36" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="2142" y="335.25" style="font-size:15px;font-weight:700;fill:#334155;text-anchor:middle">In</text><path d="M2142 348 L2142 390 L2012 390 L2012 450" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="1957" y="453" width="110" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="2012" y="481.6" style="font-size:16px;font-weight:700;fill:#64748b;text-anchor:middle">LLM</text><path d="M2012 499 L2012 560 L2142 560 L2142 592" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><path d="M2142 348 L2142 390 L2142 390 L2142 450" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="2087" y="453" width="110" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="2142" y="481.6" style="font-size:16px;font-weight:700;fill:#64748b;text-anchor:middle">LLM</text><path d="M2142 499 L2142 560 L2142 560 L2142 592" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><path d="M2142 348 L2142 390 L2272 390 L2272 450" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="2217" y="453" width="110" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="2272" y="481.6" style="font-size:16px;font-weight:700;fill:#64748b;text-anchor:middle">LLM</text><path d="M2272 499 L2272 560 L2142 560 L2142 592" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="2067" y="593" width="150" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="2142" y="621.6" style="font-size:16px;font-weight:700;fill:#64748b;text-anchor:middle">aggregate</text><path d="M2142 639 L2142 722" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="2097" y="722" width="90" height="36" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="2142" y="745.25" style="font-size:15px;font-weight:700;fill:#334155;text-anchor:middle">Out</text><line x1="1954" y1="790" x2="2330" y2="790" stroke="#e2e8f0" stroke-width="2"/><text x="2142" y="826" style="font-size:14px;font-weight:700;fill:#64748b;text-anchor:middle">IN THIS SYSTEM</text><text x="2142" y="860" style="font-size:17.5px;font-weight:500;fill:#64748b;text-anchor:middle">Not used. Editors run one</text><text x="2142" y="886" style="font-size:17.5px;font-weight:500;fill:#64748b;text-anchor:middle">after another, because later</text><text x="2142" y="912" style="font-size:17.5px;font-weight:500;fill:#64748b;text-anchor:middle">editors polish text that</text><text x="2142" y="938" style="font-size:17.5px;font-weight:500;fill:#64748b;text-anchor:middle">earlier ones may rewrite.</text><rect x="2086.6" y="1001" width="110.8" height="38" rx="19" fill="#fff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/><text x="2142" y="1026" style="font-size:16.5px;font-weight:700;fill:#64748b;text-anchor:middle">NOT USED</text></svg>