<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 980" width="680" height="980" role="img" style="font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="680" height="980" fill="#fff"/>
<text x="24" y="32" style="font-size:18px;font-weight:700;fill:#0f172a;text-anchor:start">Five workflow patterns, and the three this system uses</text><text x="24" y="54" style="font-size:12px;font-weight:500;fill:#475569;text-anchor:start">Solid cards are used; dashed grey cards are not.</text><rect x="16" y="72" width="648" height="168" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><rect x="16" y="72" width="648" height="34" rx="10" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><rect x="16" y="92" width="648" height="14" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="30" y="94" style="font-size:14px;font-weight:700;fill:#fff;text-anchor:start">Prompt chaining</text><rect x="607.2" y="78" width="46.8" height="22" rx="11" fill="rgba(255,255,255,0.18)" stroke="#fff" stroke-width="1.2"/><text x="630.6" y="93" style="font-size:10px;font-weight:700;fill:#fff;text-anchor:middle">USED</text><text x="30" y="126" style="font-size:12px;font-weight:500;fill:#475569;text-anchor:start">Fixed steps in order, with a check between steps</text><rect x="27" y="153" width="58" height="22" rx="7" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="56" y="167.5" style="font-size:10px;font-weight:500;fill:#0f172a;text-anchor:middle">step 1</text><path d="M86 164 L114 164" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#ah)"/><path d="M134 150L152.9 164L134 178L115.1 164Z" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="134" y="168" style="font-size:11px;font-weight:700;fill:#1e293b;text-anchor:middle">gate</text><path d="M154 164 L182 164" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#ah)"/><rect x="185" y="153" width="58" height="22" rx="7" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="214" y="167.5" style="font-size:10px;font-weight:500;fill:#0f172a;text-anchor:middle">step 2</text><path d="M244 164 L272 164" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#ah)"/><rect x="275" y="153" width="58" height="22" rx="7" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="304" y="167.5" style="font-size:10px;font-weight:500;fill:#0f172a;text-anchor:middle">step 3</text><text x="30" y="200" style="font-size:10px;font-weight:700;fill:#2563eb;text-anchor:start">IN THIS SYSTEM</text><text x="30" y="218" style="font-size:11.5px;font-weight:500;fill:#1e293b;text-anchor:start">The backbone. Gate → substance → line → figures → gate → series:</text><text x="30" y="232" style="font-size:11.5px;font-weight:500;fill:#1e293b;text-anchor:start">each stage starts only when the one before it passes.</text><rect x="16" y="252" width="648" height="168" rx="10" fill="#fff" stroke="#c2410c" stroke-width="2.5"/><rect x="16" y="252" width="648" height="34" rx="10" fill="#c2410c" stroke="#c2410c" stroke-width="1.5"/><rect x="16" y="272" width="648" height="14" rx="0" fill="#c2410c" stroke="#c2410c" stroke-width="1.5"/><text x="30" y="274" style="font-size:14px;font-weight:700;fill:#fff;text-anchor:start">Evaluator–optimizer</text><rect x="607.2" y="258" width="46.8" height="22" rx="11" fill="rgba(255,255,255,0.18)" stroke="#fff" stroke-width="1.2"/><text x="630.6" y="273" style="font-size:10px;font-weight:700;fill:#fff;text-anchor:middle">USED</text><text x="30" y="306" style="font-size:12px;font-weight:500;fill:#475569;text-anchor:start">One model drafts, another critiques, and they loop</text><rect x="67" y="319" width="78" height="22" rx="7" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="106" y="333.5" style="font-size:10px;font-weight:500;fill:#0f172a;text-anchor:middle">generator</text><rect x="177" y="347" width="78" height="22" rx="7" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="216" y="361.5" style="font-size:10px;font-weight:500;fill:#0f172a;text-anchor:middle">evaluator</text><path d="M146 330 H216 V346" fill="none" stroke="#c2410c" stroke-width="1.2" marker-end="url(#ah)"/><path d="M176 358 H106 V342" fill="none" stroke="#c2410c" stroke-width="1.2" marker-end="url(#ah)"/><text x="281" y="344" style="font-size:10px;font-weight:500;fill:#c2410c;text-anchor:start">loop ≤ 3</text><text x="30" y="380" style="font-size:10px;font-weight:700;fill:#c2410c;text-anchor:start">IN THIS SYSTEM</text><text x="30" y="398" style="font-size:11.5px;font-weight:500;fill:#1e293b;text-anchor:start">Every editor. The writer revises until the editor returns</text><text x="30" y="412" style="font-size:11.5px;font-weight:500;fill:#1e293b;text-anchor:start">SATISFIED, for at most three rounds.</text><rect x="16" y="432" width="648" height="168" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/><rect x="16" y="432" width="648" height="34" rx="10" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><rect x="16" y="452" width="648" height="14" rx="0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><text x="30" y="454" style="font-size:14px;font-weight:700;fill:#fff;text-anchor:start">Orchestrator–workers</text><rect x="506.4" y="438" width="147.6" height="22" rx="11" fill="rgba(255,255,255,0.18)" stroke="#fff" stroke-width="1.2"/><text x="580.2" y="453" style="font-size:10px;font-weight:700;fill:#fff;text-anchor:middle">USED, FIXED ROSTER</text><text x="30" y="486" style="font-size:12px;font-weight:500;fill:#475569;text-anchor:start">A lead model hands subtasks to workers</text><rect x="61" y="513" width="90" height="22" rx="7" fill="#f3edff" stroke="#7c3aed" stroke-width="1.5"/><text x="106" y="527.5" style="font-size:10px;font-weight:500;fill:#0f172a;text-anchor:middle">orchestrator</text><path d="M152 524 L236 524" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="218" y="513" width="36" height="22" rx="7" fill="#f3edff" stroke="#7c3aed" stroke-width="1.5"/><text x="236" y="527.5" style="font-size:10px;font-weight:500;fill:#0f172a;text-anchor:middle">w</text><path d="M152 524 L294 524" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="276" y="513" width="36" height="22" rx="7" fill="#f3edff" stroke="#7c3aed" stroke-width="1.5"/><text x="294" y="527.5" style="font-size:10px;font-weight:500;fill:#0f172a;text-anchor:middle">w</text><path d="M152 524 L352 524" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="334" y="513" width="36" height="22" rx="7" fill="#f3edff" stroke="#7c3aed" stroke-width="1.5"/><text x="352" y="527.5" style="font-size:10px;font-weight:500;fill:#0f172a;text-anchor:middle">w</text><text x="30" y="560" style="font-size:10px;font-weight:700;fill:#7c3aed;text-anchor:start">IN THIS SYSTEM</text><text x="30" y="578" style="font-size:11.5px;font-weight:500;fill:#1e293b;text-anchor:start">The writer starts each editor as a cold subagent. The roster</text><text x="30" y="592" style="font-size:11.5px;font-weight:500;fill:#1e293b;text-anchor:start">is fixed in a file, never chosen at runtime.</text><rect x="16" y="612" width="648" height="168" rx="10" fill="#fbfcfd" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6"/><rect x="16" y="612" width="648" height="34" rx="10" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.5"/><rect x="16" y="632" width="648" height="14" rx="0" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.5"/><text x="30" y="634" style="font-size:14px;font-weight:700;fill:#fff;text-anchor:start">Routing</text><rect x="578.4" y="618" width="75.6" height="22" rx="11" fill="rgba(255,255,255,0.18)" stroke="#fff" stroke-width="1.2"/><text x="616.2" y="633" style="font-size:10px;font-weight:700;fill:#fff;text-anchor:middle">NOT USED</text><text x="30" y="666" style="font-size:12px;font-weight:500;fill:#475569;text-anchor:start">Classify the input and send it down one path</text><path d="M106 690L124.9 704L106 718L87.1 704Z" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="106" y="708" style="font-size:11px;font-weight:700;fill:#1e293b;text-anchor:middle">router</text><path d="M126 704 L154 682 L176 682" fill="none" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#ah)"/><rect x="190" y="671" width="48" height="22" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="214" y="685.5" style="font-size:10px;font-weight:500;fill:#64748b;text-anchor:middle">path</text><path d="M126 704 L154 704 L176 704" fill="none" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#ah)"/><rect x="190" y="693" width="48" height="22" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="214" y="707.5" style="font-size:10px;font-weight:500;fill:#64748b;text-anchor:middle">path</text><path d="M126 704 L154 726 L176 726" fill="none" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#ah)"/><rect x="190" y="715" width="48" height="22" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="214" y="729.5" style="font-size:10px;font-weight:500;fill:#64748b;text-anchor:middle">path</text><text x="30" y="740" style="font-size:10px;font-weight:700;fill:#64748b;text-anchor:start">IN THIS SYSTEM</text><text x="30" y="758" style="font-size:11.5px;font-weight:500;fill:#64748b;text-anchor:start">Not really. Scripts count and models judge, but that split</text><text x="30" y="772" style="font-size:11.5px;font-weight:500;fill:#64748b;text-anchor:start">is decided in advance, not per input.</text><rect x="16" y="792" width="648" height="168" rx="10" fill="#fbfcfd" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6"/><rect x="16" y="792" width="648" height="34" rx="10" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.5"/><rect x="16" y="812" width="648" height="14" rx="0" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.5"/><text x="30" y="814" style="font-size:14px;font-weight:700;fill:#fff;text-anchor:start">Parallelization</text><rect x="578.4" y="798" width="75.6" height="22" rx="11" fill="rgba(255,255,255,0.18)" stroke="#fff" stroke-width="1.2"/><text x="616.2" y="813" style="font-size:10px;font-weight:700;fill:#fff;text-anchor:middle">NOT USED</text><text x="30" y="846" style="font-size:12px;font-weight:500;fill:#475569;text-anchor:start">Run several models at once; split the work, or vote</text><rect x="122" y="851" width="48" height="22" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="146" y="865.5" style="font-size:10px;font-weight:500;fill:#64748b;text-anchor:middle">LLM</text><path d="M170 862 L226 884" fill="none" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#ah)"/><rect x="122" y="873" width="48" height="22" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="146" y="887.5" style="font-size:10px;font-weight:500;fill:#64748b;text-anchor:middle">LLM</text><path d="M170 884 L226 884" fill="none" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#ah)"/><rect x="122" y="895" width="48" height="22" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="146" y="909.5" style="font-size:10px;font-weight:500;fill:#64748b;text-anchor:middle">LLM</text><path d="M170 906 L226 884" fill="none" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#ah)"/><rect x="235" y="873" width="78" height="22" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="274" y="887.5" style="font-size:10px;font-weight:500;fill:#64748b;text-anchor:middle">aggregate</text><text x="30" y="920" style="font-size:10px;font-weight:700;fill:#64748b;text-anchor:start">IN THIS SYSTEM</text><text x="30" y="938" style="font-size:11.5px;font-weight:500;fill:#64748b;text-anchor:start">Not used. Editors run one after another, because later editors</text><text x="30" y="952" style="font-size:11.5px;font-weight:500;fill:#64748b;text-anchor:start">polish text that earlier ones may rewrite.</text></svg>