<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1080" width="680" height="1080" role="img" style="font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="680" height="1080" fill="#fff"/>
<text x="24" y="28" style="font-size:18px;font-weight:700;fill:#0f172a;text-anchor:start">How each guide moves through review</text><text x="24" y="48" style="font-size:12px;font-weight:500;fill:#475569;text-anchor:start">One writer, eleven cold editors, two script gates, two human decisions.</text><rect x="24" y="62" width="14" height="14" rx="3" fill="#fff7d6" stroke="#b45309" stroke-width="1.3"/><text x="44" y="73" style="font-size:11px;font-weight:500;fill:#0f172a;text-anchor:start">Author</text><rect x="100.8" y="62" width="14" height="14" rx="3" fill="#f3edff" stroke="#7c3aed" stroke-width="1.3"/><text x="120.8" y="73" style="font-size:11px;font-weight:500;fill:#0f172a;text-anchor:start">Writer</text><rect x="177.6" y="62" width="14" height="14" rx="3" fill="#e3f7f4" stroke="#0f766e" stroke-width="1.3"/><text x="197.6" y="73" style="font-size:11px;font-weight:500;fill:#0f172a;text-anchor:start">Gate</text><rect x="240.8" y="62" width="14" height="14" rx="3" fill="#fff1e6" stroke="#c2410c" stroke-width="1.3"/><text x="260.8" y="73" style="font-size:11px;font-weight:500;fill:#0f172a;text-anchor:start">Editor</text><rect x="317.6" y="62" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/><text x="337.6" y="73" style="font-size:11px;font-weight:500;fill:#0f172a;text-anchor:start">Files</text><rect x="200" y="76" width="280" height="44" rx="22" fill="#fff7d6" stroke="#b45309" stroke-width="1.5"/><text x="340" y="94.7" style="font-size:12px;font-weight:700;fill:#1e293b;text-anchor:middle">Author writes the brief,</text><text x="340" y="109.7" style="font-size:12px;font-weight:500;fill:#1e293b;text-anchor:middle">approves the outline</text><path d="M340 120 L340 140" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#ah)"/><rect x="190" y="134" width="300" height="44" rx="7" fill="#f3edff" stroke="#7c3aed" stroke-width="1.5"/><text x="340" y="152.7" style="font-size:12px;font-weight:700;fill:#1e293b;text-anchor:middle">Writer drafts</text><text x="340" y="167.7" style="font-size:12px;font-weight:500;fill:#1e293b;text-anchor:middle">every code block really run</text><text x="500" y="148" style="font-size:10.5px;font-weight:500;fill:#475569;text-anchor:start">reads notation,</text><text x="500" y="161" style="font-size:10.5px;font-weight:500;fill:#475569;text-anchor:start">glossary, ledger</text><path d="M340 178 L340 198" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#ah)"/><path d="M340 192L377.8 220L340 248L302.2 220Z" fill="#e3f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="340" y="217.5" style="font-size:11px;font-weight:700;fill:#1e293b;text-anchor:middle">gate</text><text x="340" y="230.5" style="font-size:11px;font-weight:500;fill:#1e293b;text-anchor:middle">check</text><text x="390" y="210" style="font-size:10.5px;font-weight:500;fill:#0f766e;text-anchor:start">length, rhythm,</text><text x="390" y="223" style="font-size:10.5px;font-weight:500;fill:#0f766e;text-anchor:start">code rerun</text><path d="M302 220 H220 V156 H188" fill="none" stroke="#0f766e" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="212" y="188" style="font-size:10px;font-weight:500;fill:#0f766e;text-anchor:end">fail</text><path d="M340 250 L340 270" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#ah)"/><rect x="103" y="262" width="474" height="88" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/><text x="113" y="278" style="font-size:10.5px;font-weight:700;fill:#475569;text-anchor:start">SUBSTANCE — fix what is said</text><rect x="113" y="294" width="86" height="36" rx="7" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="156" y="315.5" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">code</text><rect x="205" y="294" width="86" height="36" rx="7" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="248" y="315.5" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">accuracy</text><rect x="297" y="294" width="86" height="36" rx="7" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="340" y="315.5" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">currency</text><rect x="389" y="294" width="86" height="36" rx="7" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="432" y="309" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">miscon-</text><text x="432" y="322" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">ceptions</text><rect x="481" y="294" width="86" height="36" rx="7" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="524" y="309" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">complete-</text><text x="524" y="322" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">ness</text><path d="M340 352 L340 372" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#ah)"/><rect x="195" y="362" width="290" height="88" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/><text x="205" y="378" style="font-size:10.5px;font-weight:700;fill:#475569;text-anchor:start">LINE AND FIGURES — then how it is said</text><rect x="205" y="394" width="86" height="36" rx="7" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="248" y="409" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">conver-</text><text x="248" y="422" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">sational</text><rect x="297" y="394" width="86" height="36" rx="7" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="340" y="415.5" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">slop</text><rect x="389" y="394" width="86" height="36" rx="7" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="432" y="415.5" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">figures</text><path d="M340 452 L340 472" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#ah)"/><path d="M340 474L377.8 502L340 530L302.2 502Z" fill="#e3f7f4" stroke="#0f766e" stroke-width="1.5"/><text x="340" y="499.5" style="font-size:11px;font-weight:700;fill:#1e293b;text-anchor:middle">gate</text><text x="340" y="512.5" style="font-size:11px;font-weight:500;fill:#1e293b;text-anchor:middle">again</text><text x="390" y="496" style="font-size:10.5px;font-weight:500;fill:#0f766e;text-anchor:start">same checks on</text><text x="390" y="509" style="font-size:10.5px;font-weight:500;fill:#0f766e;text-anchor:start">the revised draft</text><path d="M340 532 L340 552" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#ah)"/><rect x="195" y="544" width="290" height="88" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/><text x="205" y="560" style="font-size:10.5px;font-weight:700;fill:#475569;text-anchor:start">SERIES — agree with the other eleven?</text><rect x="205" y="576" width="86" height="36" rx="7" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="248" y="591" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">consis-</text><text x="248" y="604" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">tency</text><rect x="297" y="576" width="86" height="36" rx="7" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="340" y="591" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">simplif.</text><text x="340" y="604" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">ledger</text><rect x="389" y="576" width="86" height="36" rx="7" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="432" y="591" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">running</text><text x="432" y="604" style="font-size:10px;font-weight:500;fill:#1e293b;text-anchor:middle">example</text><text x="515" y="574" style="font-size:10.5px;font-weight:500;fill:#475569;text-anchor:start">updates series</text><text x="515" y="587" style="font-size:10.5px;font-weight:500;fill:#475569;text-anchor:start">files</text><path d="M340 634 L340 654" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#ah)"/><rect x="190" y="658" width="300" height="44" rx="7" fill="#f3edff" stroke="#7c3aed" stroke-width="1.5"/><text x="340" y="676.7" style="font-size:12px;font-weight:700;fill:#1e293b;text-anchor:middle">Writer writes the summary</text><text x="340" y="691.7" style="font-size:12px;font-weight:500;fill:#1e293b;text-anchor:middle">rounds, verdicts, open findings</text><path d="M340 702 L340 722" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#ah)"/><rect x="200" y="716" width="280" height="44" rx="22" fill="#fff7d6" stroke="#b45309" stroke-width="1.5"/><text x="340" y="734.7" style="font-size:12px;font-weight:700;fill:#1e293b;text-anchor:middle">Author decides</text><text x="340" y="749.7" style="font-size:12px;font-weight:500;fill:#1e293b;text-anchor:middle">whether to publish</text><rect x="16" y="788" width="648" height="78" rx="8" fill="#f3edff" stroke="#7c3aed" stroke-width="1.5"/><text x="28" y="808" style="font-size:11px;font-weight:700;fill:#7c3aed;text-anchor:start">THE WRITER</text><text x="28" y="826" style="font-size:11px;font-weight:500;fill:#1e293b;text-anchor:start">One agent drafts, starts each editor cold (file paths in, verdict out), arbitrates findings,</text><text x="28" y="842" style="font-size:11px;font-weight:500;fill:#1e293b;text-anchor:start">and never marks a guide as shipped. Editors advise; the writer arbitrates; the author decides.</text><rect x="16" y="878" width="648" height="92" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="28" y="898" style="font-size:11px;font-weight:700;fill:#475569;text-anchor:start">SERIES FILES — memory across conversations</text><text x="28" y="918" style="font-size:10.5px;font-weight:500;fill:#334155;text-anchor:start;font-family:ui-monospace,Menlo,Consolas,monospace">briefs · notation.md · glossary.md · concepts.md · ledger.md · running-example.md · editors/*.md</text><text x="28" y="936" style="font-size:11px;font-weight:500;fill:#1e293b;text-anchor:start">The ledger records simplifications and where they are later repaid. A stale glossary propagates</text><text x="28" y="952" style="font-size:11px;font-weight:500;fill:#1e293b;text-anchor:start">errors as efficiently as a current one prevents them.</text><rect x="16" y="982" width="648" height="86" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/><text x="28" y="1002" style="font-size:11px;font-weight:700;fill:#c2410c;text-anchor:start">STOP RULES</text><text x="28" y="1020" style="font-size:10.5px;font-weight:500;fill:#1e293b;text-anchor:start">SATISFIED = no HIGH findings and at most two MEDIUM. Loop ≤ 3 rounds; open findings go to the author.</text><text x="28" y="1036" style="font-size:10.5px;font-weight:500;fill:#1e293b;text-anchor:start">Order is enforced by instructions and the files each stage leaves behind — only the gate is code.</text><text x="28" y="1052" style="font-size:10.5px;font-weight:500;fill:#1e293b;text-anchor:start">Across 12 guides: 131 first-round reviews, ~200 editor rounds, all sequential.</text></svg>