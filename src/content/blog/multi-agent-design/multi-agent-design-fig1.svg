<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1064" width="720" height="1064" role="img" aria-label="Five workflow patterns, and the three this system uses" style="font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title>Five workflow patterns, and the three this system uses</title>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker></defs>
<rect width="720" height="1064" fill="#fff"/>
<text x="16" y="30" style="font-size:20px;font-weight:700;fill:#0f172a;text-anchor:start">Five workflow patterns, and the three this system uses</text><text x="16" y="52" style="font-size:13px;font-weight:400;fill:#475569;text-anchor:start">Solid rows are used; dashed grey rows are not. Pattern names follow Schluntz and Zhang (2024).</text><rect x="16" y="70" width="688" height="186" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="16" y="70" width="688" height="38" rx="10" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><rect x="16" y="92" width="688" height="16" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="32" y="95" style="font-size:16px;font-weight:700;fill:#fff;text-anchor:start">Prompt chaining</text><rect x="638.4" y="77" width="51.6" height="24" rx="12" fill="#fff" stroke="#fff" stroke-width="1.5"/><text x="664.1999999999999" y="93" style="font-size:11.5px;font-weight:700;fill:#2563eb;text-anchor:middle">USED</text><text x="32" y="132" style="font-size:13.5px;font-weight:400;fill:#475569;text-anchor:start">Fixed steps in order, with a check between steps</text><text x="408" y="162" style="font-size:11px;font-weight:700;fill:#2563eb;text-anchor:start">IN THIS SYSTEM</text><text x="408" y="184" style="font-size:13px;font-weight:400;fill:#1e293b;text-anchor:start">The backbone. Gate, substance, line,</text><text x="408" y="203" style="font-size:13px;font-weight:400;fill:#1e293b;text-anchor:start">figures, gate, series: each stage starts</text><text x="408" y="222" style="font-size:13px;font-weight:400;fill:#1e293b;text-anchor:start">only when the one before it passes.</text><rect x="32" y="184" width="70" height="28" rx="6" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="67" y="202.2" style="font-size:12px;font-weight:400;fill:#1e293b;text-anchor:middle">step 1</text><path d="M102 198 L124 198" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ah0)"/><path d="M158 176L189.9 198L158 220L126.1 198Z" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="158" y="202.025" style="font-size:11.5px;font-weight:700;fill:#1e293b;text-anchor:middle">gate</text><path d="M190 198 L212 198" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ah0)"/><rect x="212" y="184" width="70" height="28" rx="6" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="247" y="202.2" style="font-size:12px;font-weight:400;fill:#1e293b;text-anchor:middle">step 2</text><path d="M282 198 L304 198" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ah0)"/><rect x="304" y="184" width="70" height="28" rx="6" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/><text x="339" y="202.2" style="font-size:12px;font-weight:400;fill:#1e293b;text-anchor:middle">step 3</text><path d="M158 176 V154 H67 V182" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah1)"/><text x="112" y="150" style="font-size:11px;font-weight:400;fill:#64748b;text-anchor:middle">fail</text><rect x="16" y="268" width="688" height="186" rx="10" fill="#fff" stroke="#c2410c" stroke-width="2"/><rect x="16" y="268" width="688" height="38" rx="10" fill="#c2410c" stroke="#c2410c" stroke-width="1.5"/><rect x="16" y="290" width="688" height="16" rx="0" fill="#c2410c" stroke="#c2410c" stroke-width="1.5"/><text x="32" y="293" style="font-size:16px;font-weight:700;fill:#fff;text-anchor:start">Evaluator–optimizer</text><rect x="638.4" y="275" width="51.6" height="24" rx="12" fill="#fff" stroke="#fff" stroke-width="1.5"/><text x="664.1999999999999" y="291" style="font-size:11.5px;font-weight:700;fill:#c2410c;text-anchor:middle">USED</text><text x="32" y="330" style="font-size:13.5px;font-weight:400;fill:#475569;text-anchor:start">One model drafts, another critiques, and they loop</text><text x="408" y="360" style="font-size:11px;font-weight:700;fill:#c2410c;text-anchor:start">IN THIS SYSTEM</text><text x="408" y="382" style="font-size:13px;font-weight:400;fill:#1e293b;text-anchor:start">Every editor. The writer revises until</text><text x="408" y="401" style="font-size:13px;font-weight:400;fill:#1e293b;text-anchor:start">the editor returns SATISFIED, for at</text><text x="408" y="420" style="font-size:13px;font-weight:400;fill:#1e293b;text-anchor:start">most three rounds.</text><rect x="37" y="382" width="90" height="28" rx="6" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="82" y="400.2" style="font-size:12px;font-weight:400;fill:#1e293b;text-anchor:middle">generator</text><rect x="187" y="382" width="90" height="28" rx="6" fill="#fff1e6" stroke="#c2410c" stroke-width="1.5"/><text x="232" y="400.2" style="font-size:12px;font-weight:400;fill:#1e293b;text-anchor:middle">evaluator</text><path d="M127 389 L185 389" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#ah2)"/><text x="156" y="383" style="font-size:11px;font-weight:400;fill:#64748b;text-anchor:middle">draft</text><path d="M187 403 L129 403" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#ah2)"/><text x="156" y="418" style="font-size:11px;font-weight:400;fill:#64748b;text-anchor:middle">critique</text><path d="M277 396 L306 396" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ah0)"/><text x="292" y="386" style="font-size:11px;font-weight:400;fill:#64748b;text-anchor:middle">ok</text><rect x="311.5" y="384" width="41" height="24" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><text x="332" y="400.2" style="font-size:12px;font-weight:400;fill:#475569;text-anchor:middle">Out</text><rect x="16" y="466" width="688" height="186" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="16" y="466" width="688" height="38" rx="10" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><rect x="16" y="488" width="688" height="16" rx="0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><text x="32" y="491" style="font-size:16px;font-weight:700;fill:#fff;text-anchor:start">Orchestrator–workers</text><rect x="534.8" y="473" width="155.20000000000002" height="24" rx="12" fill="#fff" stroke="#fff" stroke-width="1.5"/><text x="612.4" y="489" style="font-size:11.5px;font-weight:700;fill:#7c3aed;text-anchor:middle">USED, FIXED ROSTER</text><text x="32" y="528" style="font-size:13.5px;font-weight:400;fill:#475569;text-anchor:start">A lead model hands subtasks to workers</text><text x="408" y="558" style="font-size:11px;font-weight:700;fill:#7c3aed;text-anchor:start">IN THIS SYSTEM</text><text x="408" y="580" style="font-size:13px;font-weight:400;fill:#1e293b;text-anchor:start">The writer starts each editor as a cold</text><text x="408" y="599" style="font-size:13px;font-weight:400;fill:#1e293b;text-anchor:start">subagent and applies its findings. The</text><text x="408" y="618" style="font-size:13px;font-weight:400;fill:#1e293b;text-anchor:start">roster is fixed in a file, never chosen.</text><rect x="32" y="580" width="100" height="28" rx="6" fill="#f3edff" stroke="#7c3aed" stroke-width="1.5"/><text x="82" y="598.2" style="font-size:12px;font-weight:400;fill:#1e293b;text-anchor:middle">orchestrator</text><path d="M132 583.8 L198 560" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah3)"/><rect x="198" y="548" width="64" height="24" rx="6" fill="#f3edff" stroke="#7c3aed" stroke-width="1.5"/><text x="230" y="564.2" style="font-size:12px;font-weight:400;fill:#1e293b;text-anchor:middle">worker</text><path d="M262 560 L290 583.8" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ah0)"/><path d="M132 594 L198 594" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah3)"/><rect x="198" y="582" width="64" height="24" rx="6" fill="#f3edff" stroke="#7c3aed" stroke-width="1.5"/><text x="230" y="598.2" style="font-size:12px;font-weight:400;fill:#1e293b;text-anchor:middle">worker</text><path d="M262 594 L290 594" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ah0)"/><path d="M132 604.2 L198 628" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah3)"/><rect x="198" y="616" width="64" height="24" rx="6" fill="#f3edff" stroke="#7c3aed" stroke-width="1.5"/><text x="230" y="632.2" style="font-size:12px;font-weight:400;fill:#1e293b;text-anchor:middle">worker</text><path d="M262 628 L290 604.2" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ah0)"/><rect x="290" y="580" width="84" height="28" rx="6" fill="#f3edff" stroke="#7c3aed" stroke-width="1.5"/><text x="332" y="598.2" style="font-size:12px;font-weight:400;fill:#1e293b;text-anchor:middle">synthesize</text><rect x="16" y="664" width="688" height="186" rx="10" fill="#fbfcfd" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="16" y="664" width="688" height="38" rx="10" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.5"/><rect x="16" y="686" width="688" height="16" rx="0" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.5"/><text x="32" y="689" style="font-size:16px;font-weight:700;fill:#fff;text-anchor:start">Routing</text><rect x="608.8" y="671" width="81.2" height="24" rx="12" fill="transparent" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 3"/><text x="649.4" y="687" style="font-size:11.5px;font-weight:700;fill:#fff;text-anchor:middle">NOT USED</text><text x="32" y="726" style="font-size:13.5px;font-weight:400;fill:#475569;text-anchor:start">Classify the input and send it down one path</text><text x="408" y="756" style="font-size:11px;font-weight:700;fill:#64748b;text-anchor:start">IN THIS SYSTEM</text><text x="408" y="778" style="font-size:13px;font-weight:400;fill:#64748b;text-anchor:start">Not really. Scripts count and models</text><text x="408" y="797" style="font-size:13px;font-weight:400;fill:#64748b;text-anchor:start">judge, but that split is decided in</text><text x="408" y="816" style="font-size:13px;font-weight:400;fill:#64748b;text-anchor:start">advance, not per input.</text><rect x="39" y="780" width="34" height="24" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="796.2" style="font-size:12px;font-weight:400;fill:#475569;text-anchor:middle">In</text><path d="M78 792 L104 792" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah1)"/><path d="M140 770L171.9 792L140 814L108.1 792Z" fill="#fbfcfd" stroke="#94a3b8" stroke-width="1.5"/><text x="140" y="796.025" style="font-size:11.5px;font-weight:700;fill:#64748b;text-anchor:middle">router</text><path d="M172 781.8 L228 758" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah1)"/><rect x="228" y="746" width="64" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="260" y="762.2" style="font-size:12px;font-weight:400;fill:#64748b;text-anchor:middle">path A</text><path d="M292 758 L328 781.8" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah1)"/><path d="M172 792 L228 792" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah1)"/><rect x="228" y="780" width="64" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="260" y="796.2" style="font-size:12px;font-weight:400;fill:#64748b;text-anchor:middle">path B</text><path d="M292 792 L328 792" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah1)"/><path d="M172 802.2 L228 826" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah1)"/><rect x="228" y="814" width="64" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="260" y="830.2" style="font-size:12px;font-weight:400;fill:#64748b;text-anchor:middle">path C</text><path d="M292 826 L328 802.2" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah1)"/><rect x="329.5" y="780" width="41" height="24" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="350" y="796.2" style="font-size:12px;font-weight:400;fill:#475569;text-anchor:middle">Out</text><rect x="16" y="862" width="688" height="186" rx="10" fill="#fbfcfd" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="16" y="862" width="688" height="38" rx="10" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.5"/><rect x="16" y="884" width="688" height="16" rx="0" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.5"/><text x="32" y="887" style="font-size:16px;font-weight:700;fill:#fff;text-anchor:start">Parallelization</text><rect x="608.8" y="869" width="81.2" height="24" rx="12" fill="transparent" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 3"/><text x="649.4" y="885" style="font-size:11.5px;font-weight:700;fill:#fff;text-anchor:middle">NOT USED</text><text x="32" y="924" style="font-size:13.5px;font-weight:400;fill:#475569;text-anchor:start">Run several models at once; split the work, or vote</text><text x="408" y="954" style="font-size:11px;font-weight:700;fill:#64748b;text-anchor:start">IN THIS SYSTEM</text><text x="408" y="976" style="font-size:13px;font-weight:400;fill:#64748b;text-anchor:start">Not used. Editors run one after another,</text><text x="408" y="995" style="font-size:13px;font-weight:400;fill:#64748b;text-anchor:start">because later editors polish text that</text><text x="408" y="1014" style="font-size:13px;font-weight:400;fill:#64748b;text-anchor:start">earlier ones may rewrite.</text><rect x="35" y="978" width="34" height="24" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="52" y="994.2" style="font-size:12px;font-weight:400;fill:#475569;text-anchor:middle">In</text><path d="M72 979.8 L124 956" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah1)"/><rect x="124" y="944" width="60" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="154" y="960.2" style="font-size:12px;font-weight:400;fill:#64748b;text-anchor:middle">LLM</text><path d="M184 956 L238 979.8" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah1)"/><path d="M72 990 L124 990" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah1)"/><rect x="124" y="978" width="60" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="154" y="994.2" style="font-size:12px;font-weight:400;fill:#64748b;text-anchor:middle">LLM</text><path d="M184 990 L238 990" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah1)"/><path d="M72 1000.2 L124 1024" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah1)"/><rect x="124" y="1012" width="60" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="154" y="1028.2" style="font-size:12px;font-weight:400;fill:#64748b;text-anchor:middle">LLM</text><path d="M184 1024 L238 1000.2" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah1)"/><rect x="240" y="976" width="84" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="282" y="994.2" style="font-size:12px;font-weight:400;fill:#64748b;text-anchor:middle">aggregate</text><path d="M324 990 L342 990" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah1)"/><rect x="343.5" y="978" width="41" height="24" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="364" y="994.2" style="font-size:12px;font-weight:400;fill:#475569;text-anchor:middle">Out</text></svg>